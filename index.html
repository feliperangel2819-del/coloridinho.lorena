<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloridinho — Professora Lorena</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;650;700&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Quicksand', sans-serif; 
            position: relative;
            overflow-x: hidden;
        }
        
        /* Textos nas laterais */
        .side-text-left, .side-text-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #be185d;
            opacity: 0.7;
            font-size: 1.4rem;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 2px;
        }
        .side-text-left { left: 25px; }
        .side-text-right { right: 25px; transform: translateY(-50%) rotate(180deg); }

        .main-content {
            position: relative;
            z-index: 10;
        }
        
        /* Efeito de texto transparente/guia quando vazio */
        [contenteditable][data-placeholder]:empty:before {
            content: attr(data-placeholder);
            color: #d97792;
            opacity: 0.7;
            pointer-events: none;
            display: block;
        }

        /* Animação suave para o Círculo Mágico */
        @keyframes desenharCirculo {
            0% { transform: scale(0.8) rotate(-10deg); opacity: 0; }
            50% { transform: scale(1.05) rotate(3deg); opacity: 0.8; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .circulo-ia {
            animation: desenharCirculo 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            border: 3px dashed #db2777;
            background-color: rgba(255, 182, 193, 0.15);
            box-shadow: 0 0 15px rgba(219, 39, 119, 0.3);
            display: inline;
            padding: 2px 6px;
            border-radius: 9999px;
            margin: 0 2px;
        }

        /* Regra para a impressão sair limpa apenas o Coloridinho nos slides */
        @media print {
            body { background: white !important; padding: 0 !important; }
            button, .no-print { display: none !important; }
            .side-text-left, .side-text-right { display: none !important; }
            #conteudoParaPdf { box-shadow: none !important; border: none !important; width: 100% !important; max-width: 100% !important; }
        }
    </style>
</head>
<body class="bg-[#FCE8ED] min-h-screen text-slate-700 flex flex-col items-center justify-between p-4 md:p-8">

    <!-- Textos nas laterais -->
    <div class="side-text-left">Boa aula de português</div>
    <div class="side-text-right">Boa aula de português</div>

    <div id="conteudoParaPdf" class="main-content w-full max-w-5xl bg-white/95 backdrop-blur-md rounded-3xl shadow-xl overflow-hidden border border-pink-200 p-6 md:p-8">
        
        <!-- Cabeçalho do Editor -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6 border-b border-pink-100 pb-4">
            <div class="flex items-center gap-3">
                <div class="bg-pink-100 text-pink-700 p-3.5 rounded-2xl shadow-xs">
                    <i data-lucide="heart" class="w-7 h-7 fill-pink-500 text-pink-500"></i>
                </div>
                <div>
                    <div class="flex items-center gap-2 text-sm text-pink-600 font-bold uppercase tracking-wider mb-1.5">
                        <span>✨ Criado com carinho para</span>
                        <span>•</span>
                        <span class="bg-pink-100 px-3 py-0.5 rounded-full text-pink-700 font-extrabold text-sm">Professora Lorena</span>
                    </div>
                    <h1 class="text-2xl md:text-3xl font-bold text-slate-800 flex items-center gap-2">
                        Coloridinho da Prof <i data-lucide="sparkles" class="w-6 h-6 text-pink-500 inline-block"></i>
                    </h1>
                </div>
            </div>
            
            <!-- Botão de Voltar e Status Salvo -->
            <div class="flex items-center gap-3 w-full md:w-auto justify-between md:justify-end">
                <span id="statusSalvo" class="text-xs font-bold text-pink-600 bg-pink-50 px-3 py-1.5 rounded-full border border-pink-200 flex items-center gap-1">
                    <i data-lucide="check" class="w-3.5 h-3.5"></i> Salvo automaticamente
                </span>
                <a href="index.html" class="bg-pink-100 hover:bg-pink-200 text-pink-700 font-bold px-4 py-2 rounded-xl transition text-sm flex items-center gap-2 border border-pink-200">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i> Voltar
                </a>
            </div>
        </div>

        <!-- Barra de Ferramentas Estilo Word -->
        <div class="bg-[#FFF0F3] border border-pink-200 rounded-2xl p-4 mb-6 flex flex-wrap items-center gap-3 md:gap-5 shadow-xs no-print">
            
            <!-- Fonte -->
            <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-slate-700">Fonte</span>
                <select id="fontSelector" onchange="mudarFonte()" class="bg-white border border-pink-200 rounded-xl px-3.5 py-2 text-sm text-slate-700 focus:outline-none font-semibold">
                    <option value="Quicksand, sans-serif">Padrão</option>
                    <option value="Arial, sans-serif">Arial</option>
                    <option value="Georgia, serif">Georgia</option>
                    <option value="'Times New Roman', serif">Times New Roman</option>
                    <option value="'Courier New', monospace">Courier New</option>
                </select>
            </div>

            <div class="h-6 w-[1px] bg-pink-200"></div>

            <!-- Tamanho da Fonte -->
            <div class="flex items-center gap-2">
                <span class="text-sm font-bold text-slate-700">Tam</span>
                <select id="sizeSelector" onchange="mudarTamanho()" class="bg-white border border-pink-200 rounded-xl px-3.5 py-2 text-sm text-slate-700 focus:outline-none font-semibold">
                    <option value="14px">14</option>
                    <option value="16px" selected>16</option>
                    <option value="18px">18</option>
                    <option value="20px">20</option>
                    <option value="24px">24</option>
                    <option value="32px">32</option>
                </select>
            </div>

            <div class="h-6 w-[1px] bg-pink-200"></div>

            <!-- Botões de Formatação -->
            <div class="flex items-center gap-2">
                <button onclick="formatar('bold')" class="hover:bg-pink-200 rounded-xl transition font-bold text-sm px-4 py-2 bg-white border border-pink-200 cursor-pointer">N</button>
                <button onclick="formatar('italic')" class="hover:bg-pink-200 rounded-xl transition italic text-sm px-4 py-2 bg-white border border-pink-200 cursor-pointer">I</button>
                <button onclick="formatar('underline')" class="hover:bg-pink-200 rounded-xl transition underline text-sm px-4 py-2 bg-white border border-pink-200 cursor-pointer">S</button>
            </div>

            <div class="h-6 w-[1px] bg-pink-200"></div>

            <!-- Cores de Texto -->
            <div class="flex items-center gap-2.5">
                <span class="text-sm font-bold text-slate-700">Cor</span>
                <input type="color" id="textColorPicker" onchange="mudarCorTexto(this.value)" value="#334155" class="w-9 h-9 rounded-lg border border-pink-200 cursor-pointer p-0 bg-transparent">
            </div>

        </div>

        <!-- Folha de Escrita com Fundo Rosa Bem Bonito -->
        <div class="bg-[#FFD1DC] border-2 border-pink-300 rounded-2xl p-6 md:p-8 min-h-[420px] shadow-md relative flex flex-col">
            
            <!-- Campo de Título com Placeholder -->
            <h2 class="text-xl font-bold text-slate-900 mb-4 outline-none border-b border-pink-300/60 pb-2" 
                contenteditable="true" 
                id="tituloColoridinho" 
                data-placeholder="Título..."></h2>
            
            <!-- Área de Texto Editável -->
            <div id="editorTexto" 
                 contenteditable="true" 
                 class="flex-1 outline-none text-slate-900 leading-relaxed min-h-[285px] bg-[#FFE4E9]/70 p-4 rounded-xl border border-pink-300/40" 
                 data-placeholder="Escreva suas anotações ou plano de aula aqui...">
            </div>

            <!-- Rodapé Interno -->
            <div class="flex justify-between items-center text-sm font-bold text-pink-900 mt-4 pt-3 border-t border-pink-300/50">
                <span id="contadorPalavras">0 palavras • 0 caracteres</span>
            </div>
        </div>

    </div>

    <!-- Barra de Ações Inferior -->
    <div class="main-content flex flex-wrap items-center justify-center gap-4 mt-8 no-print w-full max-w-5xl">
        
        <!-- Botão Círculo Mágico -->
        <div class="flex flex-col items-center flex-1 min-w-[210px]">
            <button onclick="ativarCirculoMagico()" class="w-full bg-pink-600 hover:bg-pink-700 text-white text-base font-bold px-6 py-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2.5 cursor-pointer hover:scale-105">
                <i data-lucide="sparkles" class="w-5 h-5"></i> Círculo Mágico IA
            </button>
        </div>
        
        <!-- Botão Salvar como PDF -->
        <div class="flex flex-col items-center flex-1 min-w-[210px]">
            <span class="text-xs font-bold text-pink-800 mb-1 tracking-wide">(só funciona para computador)</span>
            <button onclick="gerarPDFParaSlide()" class="w-full bg-pink-600 hover:bg-pink-700 text-white text-sm font-bold px-4 py-4 rounded-2xl shadow-lg transition flex items-center justify-center gap-2 cursor-pointer hover:scale-105">
                <i data-lucide="file-down" class="w-5 h-5 shrink-0"></i> <span>Salvar como PDF</span>
            </button>
        </div>

        <!-- Botão Baixar .txt -->
        <div class="flex flex-col items-center flex-1 min-w-[210px]">
            <button onclick="baixarTxt()" class="w-full bg-white hover:bg-pink-50 text-slate-700 border-2 border-pink-300 text-base font-bold px-6 py-4 rounded-2xl shadow-md transition flex items-center justify-center gap-2.5 cursor-pointer hover:scale-105">
                <i data-lucide="download" class="w-5 h-5 text-pink-600"></i> Baixar .txt
            </button>
        </div>

        <!-- Botão Limpar Folha -->
        <div class="flex flex-col items-center flex-1 min-w-[210px]">
            <button onclick="limparFolha()" class="w-full bg-red-50 hover:bg-red-100 text-red-600 border-2 border-red-200 text-base font-bold px-6 py-4 rounded-2xl shadow-md transition flex items-center justify-center gap-2.5 cursor-pointer hover:scale-105">
                <i data-lucide="trash-2" class="w-5 h-5"></i> Limpar folha
            </button>
        </div>

    </div>

    <!-- Script de Funcionalidades -->
    <script>
        lucide.createIcons();

        const editor = document.getElementById('editorTexto');
        const titulo = document.getElementById('tituloColoridinho');
        const contador = document.getElementById('contadorPalavras');
        const statusSalvo = document.getElementById('statusSalvo');

        let ultimaSelecaoRange = null;

        editor.addEventListener('mouseup', capturarSelecao);
        editor.addEventListener('keyup', capturarSelecao);

        function capturarSelecao() {
            const selecao = window.getSelection();
            if (selecao.rangeCount > 0) {
                const range = selecao.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer) && !selecao.isCollapsed) {
                    ultimaSelecaoRange = range.cloneRange();
                }
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const salvo = localStorage.getItem('coloridinho_lorena_texto');
            const tituloSalvo = localStorage.getItem('coloridinho_lorena_titulo');
            if (salvo) editor.innerHTML = salvo;
            if (tituloSalvo) titulo.innerText = tituloSalvo;
            atualizarContador();
        });

        let tempoSalvar;
        editor.addEventListener('input', () => {
            atualizarContador();
            salvarAutomaticamente();
        });

        titulo.addEventListener('input', () => {
            salvarAutomaticamente();
        });

        function salvarAutomaticamente() {
            localStorage.setItem('coloridinho_lorena_texto', editor.innerHTML);
            localStorage.setItem('coloridinho_lorena_titulo', titulo.innerText);
            
            statusSalvo.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Salvando...`;
            lucide.createIcons();
            
            clearTimeout(tempoSalvar);
            tempoSalvar = setTimeout(() => {
                statusSalvo.innerHTML = `<i data-lucide="check" class="w-3.5 h-3.5"></i> Salvo automaticamente`;
                lucide.createIcons();
            }, 800);
        }

        function atualizarContador() {
            const texto = editor.innerText.trim();
            const palavras = texto === '' ? 0 : texto.split(/\s+/).length;
            const caracteres = texto.length;
            contador.innerText = `${palavras} palavras • ${caracteres} caracteres`;
        }

        function formatar(comando) {
            document.execCommand(comando, false, null);
            editor.focus();
        }

        function mudarCorTexto(cor) {
            document.execCommand('foreColor', false, cor);
            editor.focus();
        }

        function mudarFonte() {
            const fonte = document.getElementById('fontSelector').value;
            editor.style.fontFamily = fonte;
        }

        function mudarTamanho() {
            const tamanho = document.getElementById('sizeSelector').value;
            editor.style.fontSize = tamanho;
        }

        function limparFolha() {
            if(confirm('Deseja realmente limpar todo o conteúdo deste Coloridinho?')) {
                editor.innerHTML = '';
                titulo.innerText = '';
                localStorage.removeItem('coloridinho_lorena_texto');
                localStorage.removeItem('coloridinho_lorena_titulo');
                atualizarContador();
            }
        }

        function baixarTxt() {
            const nomeTitulo = titulo.innerText.trim() || "Coloridinho_da_Prof";
            const texto = editor.innerText;
            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `${nomeTitulo}.txt`;
            link.click();
        }

        function gerarPDFParaSlide() {
            window.print();
        }

        function ativarCirculoMagico() {
            const selecao = window.getSelection();
            let rangeParaUsar = null;

            if (selecao.rangeCount > 0 && !selecao.isCollapsed) {
                const range = selecao.getRangeAt(0);
                if (editor.contains(range.commonAncestorContainer)) {
                    rangeParaUsar = range;
                }
            }

            if (!rangeParaUsar && ultimaSelecaoRange) {
                rangeParaUsar = ultimaSelecaoRange;
            }

            if (!rangeParaUsar) {
                alert('✨ Selecione uma palavra ou frase com o mouse dentro do texto antes de clicar no Círculo Mágico!');
                return;
            }

            const span = document.createElement('span');
            span.className = 'circulo-ia';
            
            try {
                rangeParaUsar.surroundContents(span);
                
                // Insere um espaço logo após o círculo para facilitar a continuidade da digitação
                const space = document.createTextNode(' ');
                span.after(space);

                // Posiciona o cursor logo após o espaço criado
                const novaSelecao = window.getSelection();
                const novoRange = document.createRange();
                novoRange.setStartAfter(space);
                novoRange.collapse(true);
                novaSelecao.removeAllRanges();
                novaSelecao.addRange(novoRange);

                editor.focus();
                ultimaSelecaoRange = null;
                salvarAutomaticamente();
            } catch (e) {
                alert('Por favor, selecione o texto de forma contínua dentro da área principal de escrita.');
            }
        }
    </script>
</body>
</html>
