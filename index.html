<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coloridinho Digital — Professora Lorena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #fce7f3;
            position: relative;
            overflow-x: hidden;
        }
        /* Texto lateral legível e bem posicionado */
        .side-text-left, .side-text-right {
            position: fixed;
            top: 50%;
            transform: translateY(-50%);
            font-weight: bold;
            color: #be185d;
            opacity: 0.65;
            font-size: 1.3rem;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            pointer-events: none;
            z-index: 0;
            letter-spacing: 1px;
        }
        .side-text-left { left: 25px; }
        .side-text-right { right: 25px; transform: translateY(-50%) rotate(180deg); }

        .main-content {
            position: relative;
            z-index: 10;
        }

        @media print {
            .no-print { display: none !important; }
            body { background-color: #fff !important; }
            .side-text-left, .side-text-right { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4">

    <!-- Textos nas laterais -->
    <div class="side-text-left">Boa aula de português</div>
    <div class="side-text-right">Boa aula de português</div>

    <!-- Conteúdo Principal -->
    <div class="main-content w-full max-w-2xl bg-white rounded-2xl shadow-xl p-6 flex flex-col gap-4 border border-pink-200">
        
        <!-- Cabeçalho -->
        <div class="flex justify-between items-center border-b pb-3">
            <h1 class="text-2xl font-bold text-pink-600">Coloridinho Digital</h1>
            <span class="text-xs text-pink-500 font-medium flex items-center gap-1">
                <span class="w-2 h-2 rounded-full bg-green-500 inline-block"></span> Salvo automaticamente
            </span>
        </div>

        <!-- Barra de Ferramentas -->
        <div class="no-print flex flex-wrap gap-2 items-center bg-pink-50 p-2 rounded-lg border border-pink-100">
            <select id="fontSize" onchange="formatText('fontSize', this.value)" class="text-sm border rounded p-1 bg-white text-gray-700">
                <option value="3">Título...</option>
                <option value="1">Pequeno</option>
                <option value="3">Normal</option>
                <option value="5">Grande</option>
                <option value="7">Muito Grande</option>
            </select>
            <button onclick="formatText('bold', null)" class="px-2 py-1 bg-white border rounded font-bold text-gray-700 hover:bg-pink-100">B</button>
            <button onclick="formatText('italic', null)" class="px-2 py-1 bg-white border rounded italic text-gray-700 hover:bg-pink-100">I</button>
            <button onclick="formatText('underline', null)" class="px-2 py-1 bg-white border rounded underline text-gray-700 hover:bg-pink-100">U</button>
            <button onclick="ativarCirculoMagico()" class="px-3 py-1 bg-pink-600 text-white rounded-lg text-sm font-medium hover:bg-pink-700 transition">✨ Círculo Mágico</button>
        </div>

        <!-- Área de Edição (com o fundo rosa original que você gostou) -->
        <div id="editor" contenteditable="true" class="w-full h-80 border border-pink-200 rounded-xl p-4 focus:outline-none focus:ring-2 focus:ring-pink-400 overflow-y-auto bg-pink-50/40 text-gray-800">
            Escreva seu conteúdo aqui, Professora Lorena...
        </div>

        <!-- Rodapé da folha -->
        <div class="flex justify-between items-center text-xs text-pink-400 pt-2 border-t">
            <span id="wordCount">0 palavras • 0 caracteres</span>
            <span>Coloridinho feito com muito carinho para a Profª Lorena 💖</span>
        </div>
    </div>

    <!-- Botões inferiores originais + Aviso do PDF -->
    <div class="no-print main-content flex flex-col items-center gap-2 mt-4">
        <div class="flex flex-wrap gap-3 justify-center">
            <button onclick="window.print()" class="bg-pink-500 hover:bg-pink-600 text-white px-4 py-2 rounded-xl font-medium transition shadow-md">
                🖨️ Salvar como PDF / Slide
            </button>
            <button onclick="baixarTexto()" class="bg-white border border-pink-300 text-pink-600 hover:bg-pink-50 px-4 py-2 rounded-xl font-medium transition shadow-sm">
                📁 Baixar .txt
            </button>
            <button onclick="limparFolha()" class="bg-white border border-red-200 text-red-500 hover:bg-red-50 px-4 py-2 rounded-xl font-medium transition shadow-sm">
                🗑️ Limpar folha
            </button>
        </div>
        <!-- Aviso de computador logo abaixo do botão -->
        <span class="text-xs text-pink-700 italic font-medium bg-white/80 px-2 py-0.5 rounded">
            (Esta função de salvar em PDF / imprimir só funciona para computador)
        </span>
    </div>

    <script>
        function formatText(command, value) {
            document.execCommand(command, false, value);
            document.getElementById('editor').focus();
        }

        const editor = document.getElementById('editor');
        const wordCount = document.getElementById('wordCount');

        editor.addEventListener('input', () => {
            const text = editor.innerText.trim();
            const words = text ? text.split(/\s+/).length : 0;
            const chars = text.length;
            wordCount.innerText = `${words} palavras • ${chars} caracteres`;
        });

        function ativarCirculoMagico() {
            const selection = window.getSelection();
            if (!selection.isCollapsed) {
                const range = selection.getRangeAt(0);
                const span = document.createElement('span');
                span.style.border = '2px dashed #ec4899';
                span.style.borderRadius = '20px';
                span.style.padding = '2px 6px';
                span.style.backgroundColor = 'rgba(252, 231, 243, 0.5)';
                range.surroundContents(span);
            } else {
                alert('Selecione um trecho de texto primeiro para usar o Círculo Mágico!');
            }
        }

        function baixarTexto() {
            const texto = editor.innerText;
            const blob = new Blob([texto], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'coloridinho-anotacoes.txt';
            a.click();
        }

        function limparFolha() {
            if (confirm('Deseja mesmo limpar tudo?')) {
                editor.innerHTML = '';
                wordCount.innerText = '0 palavras • 0 caracteres';
            }
        }
    </script>
</body>
</html>
